AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - .NET (Map)
Globals:
  Function:
    Runtime: dotnet8
    Timeout: 60
    MemorySize: 512

# Coverage note: .NET's MapConfig exposes MaxConcurrency, CompletionConfig,
# NestingType, ItemNamer, and ItemSerializer (per-item result serializer). The
# per-item serdes test (9-14) uses ItemSerializer. The whole-result serdes tests
# 9-19 and 9-20 have no .NET example — MapConfig has no operation-level (aggregate)
# serializer slot; the aggregate BatchResult envelope is SDK-internal — so they are
# left uncovered by design, matching the Java approach.

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'

  MapBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-1"]
      NotImplemented:
        - id: "9-19"
          reason: "Operation-level serdes: .NET MapConfig has no whole-result serializer slot; all payloads use the one registered ILambdaSerializer."
        - id: "9-20"
          reason: "Operation-level serdes across replay: same gap as 9-19 — no whole-result serializer slot in .NET MapConfig."
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/MapBasic/
      Handler: bootstrap
      Description: Map basic (one step per item, all succeed)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemsOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/MapItemsOnly/
