      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorNoStep:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildErrorNoStep/
      Handler: bootstrap
      Description: Child context error without step
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildReturnsNull:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildReturnsNull/
      Handler: bootstrap
      Description: Child context returning null
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildPrintOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildPrintOnly/
      Handler: bootstrap
      Description: Child context with print only (no durable operations)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildStepWaitAfter:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildStepWaitAfter/
      Handler: bootstrap
      Description: Child context with step and wait inside, step and wait after
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
