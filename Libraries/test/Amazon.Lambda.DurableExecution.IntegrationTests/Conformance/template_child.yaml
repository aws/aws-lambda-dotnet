AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - .NET (Child)
Globals:
  Function:
    Runtime: dotnet8
    Timeout: 60
    MemorySize: 512


Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
      - PolicyName: DynamoDBPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - AttemptsTable
              - Arn

  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ChildBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-1"]
      NotImplemented:
        - id: "3-14"
          reason: "Child context with custom serdes: .NET has no per-operation serdes slot; all payloads use the one registered ILambdaSerializer (matches the Java approach)."
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildBasic/
      Handler: bootstrap
      Description: Child context basic - single step inside child context
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildWithName/
      Handler: bootstrap
      Description: Child context with name - named child context
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildMultipleSteps:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildMultipleSteps/
      Handler: bootstrap
      Description: Child context with multiple sequential steps
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildError/
      Handler: bootstrap
      Description: Child context error - step inside child throws
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildErrorCaught/
      Handler: bootstrap
      Description: Child context error caught - recovery step returns input
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildNested/
      Handler: bootstrap
      Description: Nested child contexts - outer and inner child with steps
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildStepRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildStepRetry/
      Handler: bootstrap
      Description: Child context with step retry (fails then succeeds)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  ChildStepRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildStepRetryExhaustion/
      Handler: bootstrap
      Description: Child context with step retry exhaustion
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildReplay/
      Handler: bootstrap
      Description: Child context replay (cached result)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
