    TestingMetadata:
      TestDescription: ["3-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildLargePayload/
      Handler: bootstrap
      Description: Child context large payload (ReplayChildren mode)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildInterrupted:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/ChildInterrupted/
      Handler: bootstrap
      Description: Child context interrupted and re-executed
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
