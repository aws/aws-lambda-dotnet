AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - .NET (Step)

# Each function is published ahead of time into publish/<FunctionName>/ by
# build_examples.sh, then SAM copies the pre-built bootstrap into the artifact
# directory via the makefile BuildMethod. Functions run on the dotnet8 managed
# runtime with Handler=bootstrap (executable model).
#
# TestingMetadata.TestDescription maps each function to the conformance
# requirement id(s) it exercises. The runner reads this block, loads the
# matching test-requirements/step/<id>.yaml, deploys + invokes the function,
# and validates the durable execution result and history.

Globals:
  Function:
    Runtime: dotnet8
    Timeout: 60
    MemorySize: 512

Resources:
  # Self-created execution role for local runs. CI replaces this with a
  # pre-existing role via scripts/inject_execution_role.py.
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
      - PolicyName: DynamoDBPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - AttemptsTable
              - Arn

  # Cross-invocation attempt counter used by the retry tests. Retry semantics
  # require observing "attempt N" across separate Lambda invocations, which the
  # replay model cannot track in-memory — a durable store is required.
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  StepBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/StepBasic/
      Handler: bootstrap
      Description: Step basic (succeeds on first attempt)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-2"]
