name: dockerized-test

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  dockerized-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Publish W3CTestHandler
        run: |
          dotnet publish test/dockerized/W3CTestHandler/W3CTestHandler.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o test/dockerized/tasks
          chmod +x test/dockerized/tasks/bootstrap

      - name: Build the test image
        run: |
          docker build . \
            -t local/test \
            -f Dockerfile.test \
            --build-arg BASE_IMAGE=public.ecr.aws/lambda/provided:al2023

      - name: Run dockerized suites
        uses: aws/containerized-test-runner-for-aws-lambda@0863dd17b5fc19585250a2405c0f939a77b4f397 # main
        with:
          suiteFileArray: '["./test/dockerized/suites/*.json"]'
          dockerImageName: 'local/test'
          taskFolder: './test/dockerized/tasks'
